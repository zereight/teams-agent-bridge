# Teams 나와의 채팅 <-> 로컬 코딩 에이전트 브리지 설정 (macOS 기준)
# config.yaml 로 복사해서 고쳐 쓰세요.
# !! API 키 같은 비밀값은 절대 여기에 쓰지 마세요. 환경변수(또는 macOS Keychain)로만 넣어요.

backend: ax             # ax (macOS 기본) | uia (Windows) | vision (스크린샷+AI, 비용 발생)
poll_interval_sec: 60   # 몇 초마다 채팅을 확인할지
data_dir: ./data        # state.json, logs/audit.jsonl, outputs/ 가 여기 생겨요
dry_run: false          # true 면 에이전트 실행도, Teams 입력도 안 함 (처음엔 true 추천)

# 내 프로젝트 설명 — 기본 에이전트 프롬프트의 {project_description} 자리에 들어가요.
# 회사/제품명은 여기(config.yaml, git 미추적)에만 적으세요. 코드엔 넣지 마세요.
project:
  name: ''
  description: 'my-project (describe your stack here)'

self_chat:
  # 창 제목 + (설정했다면) 채팅 제목에 이 정규식이 맞아야만 읽고 보내요. 안 맞으면 그 회차 통째로 건너뜀.
  # macOS 새 Teams 는 창 제목이 그냥 "Microsoft Teams" 일 수 있어서, 보통 ax.chat_header 로
  # 채팅 제목(내 이름 (You)/(나))을 같이 확인하는 걸 권해요.
  title_regex: '\(You\)|\(나\)|\(Me\)'

bot_prefix: "(b) "
# 이걸로 시작하는 메시지는 봇 출력으로 보고 절대 명령으로 실행하지 않아요.
bot_prefixes_detect: ["(b)", "[b]", "🍺"]

reply:
  max_chars: 1500        # Teams에 보낼 최대 글자 수. 넘으면 자르고 전체는 파일로 저장
  ack_on_start: true
  announce_start: true
  report_body_chars: 1200   # 최종 보고에 담을 에이전트 결과 본문 길이(글자)
  report_body_lines: 20     # 최종 보고 본문 최대 줄 수
  resync_min_interval_sec: 600   # '위치를 다시 맞췄어요' 안내는 10분에 한 번만

safety:
  dangerous_patterns:
    - '\brm\b'
    - '\brmdir\b'
    - '\bdel\b'
    - '\bdelete\b'
    - '\bdrop\b'
    - '\btruncate\b'
    - '\bpush\b'
    - '\bdeploy\b'
    - '\brelease\b'
    - '\bpublish\b'
    - '\bmerge\b'
    - '\brebase\b'
    - '\breset\s+--hard\b'
    - '--force\b'
    - '\bprod\b'
    - '\bproduction\b'
    - '\bmigrat'
    - '\bsudo\b'
    - '배포'
    - '삭제'
    - '지워'
    - '지우'
    - '제거'
    - '푸시'
    - '푸쉬'
    - '머지'
    - '병합'
    - '초기화'
    - '운영'
    - '프로덕션'
    - '릴리스'
    - '릴리즈'
    - '마이그레이션'
  approval_words: ["ㅇㅇ", "ㅇㅋ", "yes", "y", "ok", "실행", "승인", "진행"]
  cancel_words: ["취소", "ㄴㄴ", "no", "n", "cancel", "아니", "중지"]
  approval_timeout_sec: 300        # 승인 대기(ㅇㅇ/취소)는 5분 뒤 만료
  ts_slack_sec: 60                 # 시간 게이트: 시작시각보다 이만큼 이전 메시지는 실행 안 함(히스토리 리플레이 차단)
  max_commands_per_hour: 20
  repeat_limit: 3
  repeat_window_sec: 600
  max_queue: 5
  loop_guard:                 # 자기 답장을 명령으로 다시 읽는 폭주 방지
    near_send_sec: 20         # (a) 봇이 보낸 직후 X초 안에 들어온 명령만 '의심' 후보
    overlap_substr_len: 12    # (b) 봇 메시지와 12자 이상 겹치면 '의심'
    overlap_token_ratio: 0.30 # (b) 또는 토큰 30% 이상 겹치면 '의심'  (둘 다여야 의심 확정)
    window_min: 5
    max_near_runs: 3          # 5분 안에 의심 실행 3번이면 일시정지
    global_window_min: 10
    max_runs_per_global: 12   # 10분 안에 총 12번 넘으면 일시정지(핸드오프는 체인 제한이 있으면 미포함)
    resync_window_min: 5
    max_resync_notices: 3     # 5분에 봇-only 리싱크 3번 넘으면 안내 중단

agent:
  type: claude                       # claude | codex | pi (활성 백엔드)
  default: claude                     # 'type' 미설정 시 사용할 기본 에이전트
  workdir: '/Users/me/work/my-project'   # 에이전트가 일할 프로젝트 폴더 (필수)
  allowed_roots: ['/Users/me/work']  # workdir 가 이 안에 있어야만 시작해요
  timeout_sec: 1800
  prompt_via_stdin: true             # 프롬프트를 표준입력으로 넘김 (셸 인용 문제 회피)
  # default_prompt 를 생략하면 내장 pstack 프롬프트가 모든 역할/일반 작업 앞에 붙어요.
  # 끄려면 default_prompt: "" / 바꾸려면 전체 문자열을 쓰세요.
  network_allowlist: []              # curl/wget/ssh/scp 허용 호스트 (가드 훅). 비우면 전부 차단
  hook:
    enabled: true                    # 가드 훅 설치: claude --settings / codex -c (bypass 에서도 동작)
  # 가드 규칙 파일(선택). 비우면 hooks/guard.py 내장 기본 규칙 + 아래 경로 자동 탐색:
  #   hooks/guard.yaml, ~/.config/agent-guard/guard.yaml  (스키마: hooks/guard.example.yaml)
  guard_config: 
  worktrees:
    enabled: true                    # 작업마다 bridge/<역할>-<MMDD-HHMM> 워크트리에서 실행 (push 안 함)
    base_dir: '~/teams-agent-bridge/worktrees'
    clean_older_than_days: 7

  claude:
    executable: claude
    # --permission-mode: default | acceptEdits | plan | auto | dontAsk | bypassPermissions
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - 'Bash(git status *)'
      - 'Bash(git diff *)'
      - 'Bash(git log *)'
      # 프로젝트 테스트 명령 예시:
      # - 'Bash(npm test *)'
      # - 'Bash(pytest *)'
    disallowed_tools:
      - 'Bash(git push *)'
      - 'Bash(rm *)'
      - 'Bash(sudo *)'
      - 'Bash(curl *)'
      - WebFetch
    max_turns: 40
    append_system_prompt: ""
    extra_args: []
    # v2.1.259+ 이면: extra_args: ["--permission-prompts", "none"]

  codex:
    executable: codex
    # --sandbox: read-only | workspace-write | danger-full-access
    sandbox: workspace-write
    network_access: false            # -c sandbox_workspace_write.network_access=false
    hooks: true                      # PreToolUse 가드 훅을 -c 로 주입 (codex 0.154+; 샌드박스가 1차 방어)
    skip_git_repo_check: false
    ephemeral: false
    extra_args: []
  pi:                                # @earendil-works/pi-coding-agent (Mario Zechner's pi)
    executable: pi                   # nvm 사용 시 절대경로 권장 (~/.nvm/.../bin/pi)
    mode: json                       # json(파싱) | print(-p 평문)
    provider: ''                     # 비우면 ~/.pi/agent/settings.json 상속 (권장)
    model: ''                        # 비우면 상속 (기본 override 하지 않음)
    thinking: ''                     # off|minimal|low|medium|high|xhigh|max (비우면 상속)
    tools: []                        # 비우면 pi 기본(read,bash,edit,write)
    exclude_tools: []                # 예: ['web_*'] 로 네트워크 도구 제외
    skills: []                       # 추가 --skill 경로 (예: pstack-claude 스킬 디렉터리)
    block_tool_patterns: []          # 가드가 이름으로 차단할 커스텀 도구 정규식
    allow_unguarded: false           # 가드가 꺼졌을 때 쓰기 가능한 pi 실행 거부
    append_system_prompt: ''
    extra_args: []

# ===== 백엔드 A: macOS 손쉬운 사용(Accessibility) =====
# 값은 ax_select 선택자: role, subrole, identifier(정확히 일치),
# title_re / description_re / value_re / role_description_re / text_re(정규식),
# depth(루트 기준 깊이), index(여러 개 중 몇 번째) 를 조합해요.
# 실제 값은 `python bridge.py --dump-tree` 로 보고 내 PC에 맞게 고치세요.
ax:
  bundle_id: com.microsoft.teams2    # 새 Teams. 클래식이면 com.microsoft.teams
  enable_manual_accessibility: true  # 웹(Electron) AX 트리를 만들도록 요청
  activate_for_read: false           # 읽을 때는 Teams를 앞으로 안 가져옴(보낼 때만). true면 매번 앞으로.
  activate_delay_sec: 0.6
  messaging_timeout_sec: 2.0
  window: null                       # 예: {role: AXWindow, title_re: '.*Teams.*'}
  chat_header: null                  # 예: {role: AXStaticText, value_re: '.*\(You\).*', index: 0}
  # message_list / compose_box: 비워두면 내장 기본값(한국어+영어 Teams 모두 인식)을 써요.
  # 내 Teams 가 다르면 --dump-tree 보고 덮어쓰세요 (선택자는 통째로 교체돼요):
  # message_list: {role: AXGroup, description_re: '^(메시지 목록|Message list)$'}
  message_item: {role: AXGroup}      # 메시지 한 줄에 해당하는 요소
  item_text_source: children         # self | children | all
  # 항목 텍스트에서 본문/시간 뽑기 (없으면 전체가 본문)
  # 예: '(?s)^(?P<sender>.+?)\n(?P<ts>\d{1,2}:\d{2}\s*(AM|PM)?)\n(?P<text>.+)$'
  message_regex: null
  # compose_box: {role: AXTextArea, description_re: '(메시지\S*\s*입력|Type a message)'}
  click_compose_box: false           # AXFocused 로 포커스가 안 가면 true 로
  max_messages: 30
  max_depth: 60
  max_nodes: 20000
  paste_delay_sec: 0.4
  restore_clipboard: true
  clear_compose_before_paste: true

# ===== 백엔드 A(윈도우): UI Automation (쓸 때만) =====
uia:
  window: {title_re: '.*Microsoft Teams.*', control_type: Window}
  chat_header: null
  message_list: null                 # 필수
  message_item: {control_type: ListItem}
  item_text_source: name
  message_regex: null
  compose_box: {control_type: Edit, title_re: '(?i).*(type a message|메시지 입력).*'}
  max_messages: 30
  paste_delay_sec: 0.4
  restore_clipboard: true
  clear_compose_before_paste: true

# ===== 백엔드 B: 비전 (예비) =====
vision:
  api_key_env: ANTHROPIC_API_KEY     # 키 값이 아니라 "환경변수 이름"
  api_keychain_service: ""           # (선택) macOS Keychain 서비스명. security find-generic-password -s <이름> -w
  api_keychain_account: ""
  model: ""                          # 회사가 허용한 비전 지원 모델 이름 (필수)
  max_tokens: 2000
  max_image_width: 1400
  bundle_id: com.microsoft.teams2    # macOS: 창 찾기/활성화에 사용
  window_title_regex: '.*Microsoft Teams.*'   # Windows 대체
  compose_box_relative: [0.55, 0.93] # 입력창을 못 찾을 때 클릭할 창 안 비율 좌표
  cache_sec: 5
  paste_delay_sec: 0.4

# ===== 역할(여러 봇) 설정 =====
roles:
  enabled: true
  max_hops: 4                 # 한 연쇄(@역할→@역할)에서 넘길 수 있는 최대 횟수
  chain_timeout_sec: 3600     # 연쇄 전체 제한시간(초)
  silence_ping_sec: 600       # 단계 변화 없이 이만큼 조용하면 "진행 중" 한 번만 보고
  handoff_summary_chars: 400  # 다음 역할에 전달할 이전 결과 요약 길이

# 역할 간 핸드오프 허용 쌍 (이외는 보고 후 연쇄 중단, 같은 쌍 2번 튕기면 중단)
handoff:
  allowlist: ["dev->qa", "dev->reviewer", "qa->dev"]

log:
  max_bytes: 5000000
  backup_count: 10
